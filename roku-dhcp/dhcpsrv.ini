; dhcpsrv (Uwe Ruttkamp, https://www.dhcpserver.de) - Roku DNS -> AdGuard Home
; Place next to dhcpsrv.exe. NOT active until install-start.ps1 is run.
[SETTINGS]
IPBIND_1=192.0.2.28
IPPOOL_1=192.0.2.29-192.0.2.30
AssociateBindsToPools=1
Trace=1
TraceFile=dhcptrc.txt
DeleteOnRelease=0
ExpiredLeaseTimeout=3600
[GENERAL]
LEASETIME=86400
SUBNETMASK=255.255.255.0
ROUTER_0=192.0.2.15
DNS_0=192.0.2.28
DOMAINNAME=lan
[DNS-SETTINGS]
EnableDNS=0
[TFTP-SETTINGS]
EnableTFTP=0
[HTTP-SETTINGS]
EnableHTTP=0
